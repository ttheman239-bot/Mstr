name: Build Android APK

on:
  push:
    branches:
      - claude/android-bitcoin-mstr-app-Z0Zm8
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" "BTCvsMSTR-debug.apk"
          echo "apk_path=BTCvsMSTR-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCvsMSTR-debug-apk
          path: BTCvsMSTR-debug.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BTC vs MSTR v1.0.${{ github.run_number }}
          body: |
            แอป Android ที่แสดงกราฟเปรียบเทียบราคา Bitcoin (BTC) และหุ้น MicroStrategy (MSTR)

            ### วิธีติดตั้ง
            1. ดาวน์โหลดไฟล์ `BTCvsMSTR-debug.apk` ด้านล่าง
            2. เปิดไฟล์บนมือถือ Android (อาจต้องอนุญาต "Install unknown apps")
            3. กดติดตั้ง

            ข้อมูล: CoinGecko (BTC) และ Yahoo Finance (MSTR)
          files: BTCvsMSTR-debug.apk
          make_latest: true
